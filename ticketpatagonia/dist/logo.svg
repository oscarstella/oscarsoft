<svg width="240" height="70" viewBox="0 0 240 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="tp-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="tp-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Mountain Peak + Ticket Monogram Badge -->
  <g transform="translate(4, 5)">
    <!-- Ticket Badge Outer Hexagon/Shape -->
    <rect x="0" y="4" width="52" height="52" rx="16" fill="#0d1829" stroke="url(#tp-grad)" stroke-width="2"/>
    
    <!-- Notch details on ticket edge -->
    <circle cx="0" cy="30" r="5" fill="#070c16"/>
    <circle cx="52" cy="30" r="5" fill="#070c16"/>
    
    <!-- Stylized Mountain Peaks with Neon Aurora -->
    <path d="M12 40 L26 18 L34 30 L40 22 L46 40 Z" fill="url(#tp-glow)" opacity="0.4"/>
    <path d="M14 39 L26 21 L35 34 L40 26 L44 39" stroke="url(#tp-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Summit Sun / Star spark -->
    <circle cx="26" cy="15" r="3" fill="url(#tp-amber)"/>
  </g>

  <!-- Typography: TICKET PATAGONIA -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', 'Poppins', sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="#ffffff">
    TICKET<tspan fill="url(#tp-grad)">.</tspan>
  </text>
  <text x="68" y="52" font-family="'Plus Jakarta Sans', 'Poppins', sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#38bdf8">
    PATAGONIA
  </text>

  <!-- Tiny Mountain Pulse Dot -->
  <circle cx="204" cy="46" r="3" fill="#f59e0b"/>
</svg>
